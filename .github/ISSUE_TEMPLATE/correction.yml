name: Correction
description: Correct a count, link, license, or access tier
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: dataset
    attributes:
      label: Dataset id
      description: The id column in datasets/datasets.csv
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Field, current value, and proposed value
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source URL
      placeholder: https://
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date you opened that source
      placeholder: YYYY-MM-DD
    validations:
      required: true
